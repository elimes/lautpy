[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lautpy"
description = "Lightweight Python toolkit: pipe-style data processing, date/path/hash utils, decorators, webhooks and OpenAI-compatible clients"
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "elimes"},
]
keywords = ["utils", "pipe", "functional", "decorators", "retry", "webhook", "openai", "toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.optional-dependencies]
retry = ["tenacity>=8.0"]
llm = ["openai>=1.0"]
yaml = ["pyyaml"]
ml = ["scikit-learn"]
numpy = ["numpy"]
agent = ["langchain>=1.0", "langchain-openai>=1.0"]
all = ["tenacity>=8.0", "openai>=1.0", "pyyaml", "scikit-learn", "numpy",
       "langchain>=1.0", "langchain-openai>=1.0"]
dev = ["pytest", "tenacity>=8.0", "openai>=1.0", "pyyaml", "scikit-learn", "numpy",
       "langchain>=1.0", "langchain-openai>=1.0"]

[project.urls]
Homepage = "https://github.com/elimes/lautpy"
Repository = "https://github.com/elimes/lautpy"
Issues = "https://github.com/elimes/lautpy/issues"

[tool.setuptools.dynamic]
version = {file = ".data/VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
lautpy = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 长行主要出现在中文注释/docstring，由人判断
    "E741",  # 保留单字母变量（管道示例常见 l/I）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
