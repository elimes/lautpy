name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project (with dev dependency group)
        run: uv sync

      - name: Run tests (with coverage)
        run: uv run pytest tests -q --cov=lautpy --cov-report=term-missing

      - name: Lint (ruff)
        run: uvx ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy
